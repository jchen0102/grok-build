services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api_quality
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api_quality"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://api:api@db:5432/api_quality?sslmode=disable
      ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
